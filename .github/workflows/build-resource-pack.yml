name: Build AIcraft Resource Pack

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_citizentrial_pack.py"
      - ".github/workflows/build-resource-pack.yml"

permissions:
  contents: write

jobs:
  build-pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install image builder
        run: python3 -m pip install pillow

      - name: Build updated pack
        run: python3 scripts/build_citizentrial_pack.py

      - name: Commit generated packs
        run: |
          git config user.name "AIcraft Pack Builder"
          git config user.email "actions@users.noreply.github.com"
          git add AIcraft-ResourcePack-0.9.8a-CitizenTrial-Silhouette-Fix.zip
          git add server-pack.zip
          git add server-pack.sha1
          if git diff --cached --quiet; then
            echo "No pack changes."
            exit 0
          fi
          git commit -m "Build resource pack 0.9.8a with CitizenTrial silhouette fixes"
          git push
